name: ChatGPT Scan Bridge

on:
  push:
    paths:
      - ".scan/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-scan-bridge
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run AUTO scan and wait for result
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          from pathlib import Path

          BASE = "https://scalp-market-bridge.onrender.com"
          Path(".scan").mkdir(exist_ok=True)

          def get_json(url, timeout=45):
              req = urllib.request.Request(url, headers={"User-Agent":"scalp-scan-bridge/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          started = get_json(BASE + "/scan-auto")
          job_id = started.get("job_id")
          if not job_id:
              raise RuntimeError("scan-auto returned no job_id: " + json.dumps(started))

          deadline = time.time() + 15 * 60
          last = started
          while time.time() < deadline:
              time.sleep(5)
              last = get_json(BASE + "/scan-job/" + job_id)
              state = last.get("state")
              if state in ("DONE", "FAILED"):
                  break
          else:
              raise TimeoutError("scan job did not finish within 15 minutes")

          Path(".scan/latest.json").write_text(
              json.dumps(last, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print("job_id=", job_id, "state=", last.get("state"))
          if last.get("state") != "DONE":
              raise RuntimeError("scan finished unsuccessfully: " + json.dumps(last))
          PY

      - name: Publish latest result
        shell: bash
        run: |
          git config user.name "scan-bridge-bot"
          git config user.email "scan-bridge-bot@users.noreply.github.com"
          git add .scan/latest.json
          if git diff --cached --quiet; then
            echo "No result change to commit"
          else
            git commit -m "scan: publish latest AUTO result"
            git push
          fi
