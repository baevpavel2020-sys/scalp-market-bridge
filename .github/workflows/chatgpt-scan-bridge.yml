name: ChatGPT Scan Bridge

on:
  push:
    paths:
      - ".scan/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-scan-bridge
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run AUTO scan and capture result
        shell: bash
        run: |
          python - <<'PY'
          import json, time, traceback, urllib.request
          from pathlib import Path

          BASE = "https://scalp-market-bridge.onrender.com"
          OUT = Path(".scan/latest.json")
          OUT.parent.mkdir(exist_ok=True)

          def get_json(url, timeout=45):
              req = urllib.request.Request(url, headers={"User-Agent":"scalp-scan-bridge/2.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          payload = {"state":"BRIDGE_FAILED","bridge_version":"v2"}
          try:
              started = get_json(BASE + "/scan-auto")
              job_id = started.get("job_id")
              if not job_id:
                  raise RuntimeError("scan-auto returned no job_id")
              payload = {"state":"BRIDGE_RUNNING","job_id":job_id,"bridge_version":"v2"}
              deadline = time.time() + 15*60
              while time.time() < deadline:
                  time.sleep(5)
                  payload = get_json(BASE + "/scan-job/" + job_id)
                  payload["bridge_version"] = "v2"
                  if payload.get("state") in ("DONE","FAILED"):
                      break
              else:
                  payload = {"state":"BRIDGE_TIMEOUT","job_id":job_id,"bridge_version":"v2"}
          except Exception as e:
              payload = {
                  "state":"BRIDGE_FAILED",
                  "bridge_version":"v2",
                  "error":f"{type(e).__name__}: {e}",
                  "traceback":traceback.format_exc(limit=3)
              }
          OUT.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"state":payload.get("state"),"job_id":payload.get("job_id"),"error":payload.get("error")},ensure_ascii=False))
          PY

      - name: Publish result even if repository advanced
        shell: bash
        run: |
          cp .scan/latest.json /tmp/latest-scan.json
          git config user.name "scan-bridge-bot"
          git config user.email "scan-bridge-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .scan
          cp /tmp/latest-scan.json .scan/latest.json
          git add .scan/latest.json
          if git diff --cached --quiet; then
            echo "No result change to commit"
          else
            git commit -m "scan: publish latest AUTO result"
            git push origin HEAD:main
          fi
