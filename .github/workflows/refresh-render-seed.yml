name: Refresh Render historical seed

on:
  push:
    branches: ["scan-plus-multimarket"]
    paths:
      - "scripts/build_render_seed.py"
      - "scripts/seed_builder.py"
      - ".github/workflows/refresh-render-seed.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build seed
        run: python scripts/build_render_seed.py --top-n 30 --bars 500
      - name: Commit refreshed seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed_data
          if git diff --cached --quiet; then
            echo "No seed changes"
            exit 0
          fi
          git commit -m "chore: refresh Scan+ historical seed"
          git push
