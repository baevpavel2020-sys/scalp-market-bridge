name: ScanPlus Phase 1 Tests

on:
  push:
    branches: ["audit/phase1-production-fixes", "phase2/historical-seed"]
  pull_request:
    branches: ["scan-plus-multimarket", "main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test*.py" -v
      - run: python -m compileall -q .
