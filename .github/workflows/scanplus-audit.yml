name: ScanPlus Audit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py dynamic_collector.py multi_market_adapters.py market_event_engine.py pump_exhaustion.py scan_intelligence.py test_scanplus.py
      - run: python -m unittest -v test_scanplus.py
