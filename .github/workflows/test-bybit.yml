name: Test Bybit Kline Access

on:
  workflow_dispatch:

jobs:
  test-bybit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test Bybit 500-candle access
        shell: python
        run: |
          import json
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          symbols = ["ENAUSDT", "BTCUSDT", "ETHUSDT"]
          base = "https://api.bybit.com/v5/market/kline"
          failed = False

          print("=== BYBIT KLINE TEST FROM GITHUB ACTIONS ===")

          for symbol in symbols:
              params = urllib.parse.urlencode({
                  "category": "linear",
                  "symbol": symbol,
                  "interval": "D",
                  "limit": 500,
              })
              url = f"{base}?{params}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 GitHub-Actions-Bybit-Seed-Test/1.0",
                      "Accept": "application/json",
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      raw = response.read()
                  data = json.loads(raw)
                  rows = (data.get("result") or {}).get("list") or []
                  ok = status == 200 and data.get("retCode") == 0 and len(rows) == 500

                  if ok:
                      print(f"{symbol}: PASS - 500 candles")
                      print(f"  newest: {rows[0][0]}")
                      print(f"  oldest: {rows[-1][0]}")
                  else:
                      failed = True
                      print(f"{symbol}: FAIL")
                      print(f"  HTTP: {status}")
                      print(f"  retCode: {data.get('retCode')}")
                      print(f"  retMsg: {data.get('retMsg')}")
                      print(f"  candles: {len(rows)}")

              except urllib.error.HTTPError as exc:
                  failed = True
                  body = exc.read().decode("utf-8", errors="replace")[:500]
                  print(f"{symbol}: FAIL - HTTP {exc.code}")
                  print(f"  {body}")

              except Exception as exc:
                  failed = True
                  print(f"{symbol}: FAIL - {type(exc).__name__}: {exc}")

          print("=== RESULT ===")
          if failed:
              print("BYBIT_GITHUB_ACCESS=FAIL")
              sys.exit(1)

          print("BYBIT_GITHUB_ACCESS=PASS")
