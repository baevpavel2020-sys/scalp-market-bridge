name: V4 Block 8 Finalize Existing Job
on:
  push:
    branches: [scan-plus-multimarket]
    paths:
      - ".github/workflows/v4-block8-finalize.yml"
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Read the same production job
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-delay 5             "https://scalp-market-bridge.onrender.com/scan-job/5a7da9c3228a4859" > final.json
          python - <<'PY'
          import json
          p=json.load(open("final.json"))
          r=p.get("result") or {}
          ext=r.get("external") or {}
          print(json.dumps({
            "job_id":p.get("job_id"),
            "state":p.get("state"),
            "markets":r.get("markets"),
            "elapsed_ms":(r.get("telemetry") or {}).get("elapsed_ms"),
            "error_count":(r.get("telemetry") or {}).get("error_count"),
            "external": {
              m:{
                "status":v.get("status"),
                "count":v.get("count"),
                "providers":sorted({x.get("provider") for x in v.get("results",[]) if x.get("provider")}),
                "analysis_ready":sum(1 for x in v.get("results",[]) if (x.get("opportunity_funnel") or {}).get("analysis_ready") is True),
                "trade_authorized":sum(1 for x in v.get("results",[]) if (x.get("opportunity_funnel") or {}).get("trade_authorized") is True),
                "unavailable":sum(1 for x in v.get("results",[]) if (x.get("data_quality") or {}).get("state")=="UNAVAILABLE"),
                "fail":sum(1 for x in v.get("results",[]) if (x.get("data_quality") or {}).get("state")=="FAIL")
              } for m,v in ext.items()
            }
          },ensure_ascii=False,indent=2))
          PY
          cp final.json final-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-block8-final-job
          path: final-evidence.json
          retention-days: 7
