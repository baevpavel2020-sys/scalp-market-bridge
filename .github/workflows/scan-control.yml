name: Scan+ Control

on:
  issue_comment:
    types: [created]

concurrency:
  group: scan-plus-production
  cancel-in-progress: false

jobs:
  scan:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.body == 'скан' &&
      github.event.issue.title == 'SCAN CONTROL'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 15
    steps:
      - name: Start unified Scan
        id: start
        env:
          BASE_URL: https://scalp-market-bridge.onrender.com
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            "$BASE_URL/scan-auto/start" > start.json
          cat start.json
          python - <<'PY'
          import json
          d=json.load(open("start.json"))
          print("JOB_ID="+str(d["job_id"]))
          PY >> "$GITHUB_OUTPUT"

      - name: Poll the same job until terminal
        env:
          BASE_URL: https://scalp-market-bridge.onrender.com
          JOB_ID: ${{ steps.start.outputs.JOB_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl --fail --show-error --silent --retry 2 --retry-delay 2 \
              "$BASE_URL/scan-job/$JOB_ID" > result.json
            cat result.json
            STATE=$(python - <<'PY'
          import json
          print(json.load(open("result.json")).get("state","UNKNOWN"))
          PY
          )
            if [ "$STATE" = "DONE" ] || [ "$STATE" = "FAILED" ]; then
              break
            fi
            sleep 10
          done
          FINAL_STATE=$(python - <<'PY'
          import json
          print(json.load(open("result.json")).get("state","UNKNOWN"))
          PY
          )
          test "$FINAL_STATE" = "DONE"
          test -s result.json

      - name: Persist result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-result-${{ steps.start.outputs.JOB_ID }}
          path: |
            start.json
            result.json
          retention-days: 7
