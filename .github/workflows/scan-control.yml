name: Scan Control

on:
  push:
    branches: [main]
    paths:
      - runtime/scan_trigger.json

concurrency:
  group: scan-plus-production
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Start unified Scan
        id: start
        env:
          BASE_URL: https://scalp-market-bridge.onrender.com
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-delay 5 \
            "$BASE_URL/scan-auto/start" > start.json
          cat start.json
          JOB_ID=$(python -c 'import json; print(json.load(open("start.json"))["job_id"])')
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Poll the same job until terminal
        env:
          BASE_URL: https://scalp-market-bridge.onrender.com
          JOB_ID: ${{ steps.start.outputs.JOB_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl --fail --show-error --silent --retry 3 --retry-delay 3 \
              "$BASE_URL/scan-job/$JOB_ID" > result.json
            STATE=$(python -c 'import json; print(json.load(open("result.json")).get("state","UNKNOWN"))')
            echo "poll=$i state=$STATE"
            cat result.json
            if [ "$STATE" = "DONE" ] || [ "$STATE" = "FAILED" ]; then
              break
            fi
            sleep 10
          done
          FINAL_STATE=$(python -c 'import json; print(json.load(open("result.json")).get("state","UNKNOWN"))')
          test "$FINAL_STATE" = "DONE"
          test -s result.json

      - name: Persist Scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result-${{ steps.start.outputs.JOB_ID }}
          path: |
            start.json
            result.json
          retention-days: 7
