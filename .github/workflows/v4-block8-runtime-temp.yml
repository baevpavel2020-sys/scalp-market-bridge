name: V4 Block 8 Temporary Runtime Audit

on:
  push:
    branches: [scan-plus-multimarket]
    paths:
      - ".github/workflows/v4-block8-runtime-temp.yml"
      - "multi_market_adapters.py"
      - "test_scanplus.py"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Health and deterministic audit
        run: |
          set -euo pipefail
          BASE="https://scalp-market-bridge.onrender.com"
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$BASE/health" | tee health.json
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$BASE/system/status" | tee system.json
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$BASE/audit/v4" | tee audit.json

      - name: Four-market production runtime
        run: |
          set -euo pipefail
          BASE="https://scalp-market-bridge.onrender.com"
          curl --fail --show-error --silent --retry 5 --retry-delay 5             "$BASE/scan-live?top=6&shortlist=30&markets=crypto,stocks,forex,commodities" | tee start.json
          JOB_ID=$(python -c 'import json; print(json.load(open("start.json"))["job_id"])')
          echo "JOB_ID=$JOB_ID"
          for i in $(seq 1 90); do
            curl --fail --show-error --silent --retry 3 --retry-delay 3               "$BASE/scan-job/$JOB_ID" > result.json
            STATE=$(python -c 'import json; print(json.load(open("result.json")).get("state","UNKNOWN"))')
            echo "poll=$i state=$STATE"
            if [ "$STATE" = "DONE" ] || [ "$STATE" = "FAILED" ]; then
              break
            fi
            sleep 10
          done
          cat result.json
          FINAL_STATE=$(python -c 'import json; print(json.load(open("result.json")).get("state","UNKNOWN"))')
          test "$FINAL_STATE" = "DONE"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-block8-runtime-evidence
          path: |
            health.json
            system.json
            audit.json
            start.json
            result.json
          retention-days: 7
