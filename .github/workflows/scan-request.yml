name: Scan Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  scan:
    if: startsWith(github.event.issue.title, "[SCAN]")
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start unified Scan
        id: start
        env:
          BASE_URL: https://scalp-market-bridge.onrender.com
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 3 --retry-delay 2 "$BASE_URL/scan")"
          echo "$body"
          job_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<<"$body")"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for final result
        id: result
        env:
          BASE_URL: https://scalp-market-bridge.onrender.com
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body="$(curl -fsS --retry 3 --retry-delay 2 "$BASE_URL/scan-job/$JOB_ID")"
            state="$(python -c 'import json,sys; print(json.load(sys.stdin).get("state",""))' <<<"$body")"
            echo "state=$state"
            if [ "$state" = "DONE" ] || [ "$state" = "FAILED" ]; then
              printf '%s' "$body" > result.json
              break
            fi
            sleep 10
          done
          test -s result.json || { echo "Scan did not finish within workflow timeout"; exit 1; }
          {
            echo 'result<<SCAN_RESULT'
            cat result.json
            echo 'SCAN_RESULT'
          } >> "$GITHUB_OUTPUT"

      - name: Publish result to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
          RESULT: ${{ steps.result.outputs.result }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import os
          result=os.environ["RESULT"]
          print("## Scan+ result")
          print()
          print("Job: `"+os.environ["JOB_ID"]+"`")
          print()
          print("```json")
          print(result)
          print("```")
          PY
          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/comment.md
          gh issue close "$ISSUE" --repo "$REPO"
